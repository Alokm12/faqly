# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a3c5ed95b28d9315d9f9f7fcd80abea8"
name = "Faqly"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # app_subscriptions/update: a merchant can cancel, pause, or have a charge
  # decline entirely inside Shopify's admin without opening Faqly. Without
  # this, the cached plan would keep granting paid AI credits to someone who
  # stopped paying. See app/routes/webhooks.app.subscriptions_update.jsx.
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

  # MANDATORY COMPLIANCE WEBHOOKS.
  # Every public app must implement all three; a missing one is an automatic
  # App Store rejection. Faqly stores no customer data, so the two customer
  # topics acknowledge and return — but the endpoints must exist and must
  # verify the HMAC, which is what Shopify actually tests.
  #
  # shop/redact is the real one: it fires 48h after uninstall and is the only
  # place in this app that genuinely deletes a shop's content. Until then the
  # uninstall handler deliberately preserves it so a reinstall restores
  # everything.
  [[webhooks.subscriptions]]
  topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# EVERY SCOPE HERE IS ACTUALLY EXERCISED. App Store review checks that an app
# requests only what it uses, and a merchant approving an install deserves the
# same. Each line below names the code that needs it.
#
#   read_products  models/Faq.server.js hydrates the product and collection
#                  titles a FAQ is pinned to, and services/store-context.server.js
#                  reads product details to ground AI generation. Both are
#                  reads — this app never creates or edits a product, which is
#                  why this is no longer write_products.
#   write_files    routes/app.categories.upload-icon.jsx uploads category icons
#                  via stagedUploadsCreate + fileCreate. Generic file uploads
#                  need this scope; write_products does not cover them.
#   read_themes    services/theme-widget.server.js checks whether the FAQ app
#                  block is present on the live theme so the dashboard can
#                  deep-link merchants to the theme editor when it isn't.
#                  Read-only — we never write theme files.
#
# REMOVED: write_metaobjects, write_metaobject_definitions. The metaobject
# mirror is switched off (MIRROR_ENABLED = false in
# services/metaobject-sync.server.js) and nothing on the storefront reads it.
# If you ever turn the mirror on, add both scopes back here — the sync code
# will fail silently without them.
scopes = "read_products,write_files,read_themes"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[app_proxy]
url = "https://example.com/apps/faqly"
subpath = "faqly"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.faq]
name = "FAQ"
description = "Frequently asked questions shown on the storefront"

  [metaobjects.app.faq.access]
  admin = "merchant_read_write"
  storefront = "public_read"

  [metaobjects.app.faq.capabilities]
  publishable = true

[metaobjects.app.faq.fields.question]
name = "Question"
type = "single_line_text_field"
required = true

[metaobjects.app.faq.fields.answer]
name = "Answer"
type = "multi_line_text_field"
required = true

[metaobjects.app.faq.fields.status]
name = "Status"
type = "single_line_text_field"

[metaobjects.app.faq.fields.position]
name = "Position"
type = "number_integer"

[metaobjects.app.faq.fields.category]
name = "Category"
type = "metaobject_reference<$app:faq_category>"

[metaobjects.app.faq.fields.products]
name = "Products"
type = "list.product_reference"

[metaobjects.app.faq.fields.collections]
name = "Collections"
type = "list.collection_reference"

[metaobjects.app.faq_category]
name = "FAQ Category"
description = "Groups FAQs into categories"

  [metaobjects.app.faq_category.access]
  admin = "merchant_read_write"
  storefront = "public_read"

  [metaobjects.app.faq_category.capabilities]
  publishable = true

[metaobjects.app.faq_category.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.faq_category.fields.icon]
name = "Icon"
type = "single_line_text_field"

[metaobjects.app.faq_category.fields.icon_image_url]
name = "Icon Image URL"
type = "single_line_text_field"

[metaobjects.app.faq_category.fields.color]
name = "Color"
type = "single_line_text_field"

[metaobjects.app.faq_category.fields.position]
name = "Position"
type = "number_integer"

[metaobjects.app.faq_settings]
name = "FAQ Settings"
description = "App-wide Faqly settings, one entry per store"

  [metaobjects.app.faq_settings.access]
  admin = "merchant_read_write"

[metaobjects.app.faq_settings.fields.powered_by_visible]
name = "Powered by visible"
type = "boolean"

[metaobjects.app.faq_settings.fields.schema_enabled]
name = "Schema enabled"
type = "boolean"

[metaobjects.app.faq_settings.fields.feedback_enabled]
name = "Feedback enabled"
type = "boolean"

[metaobjects.app.faq_settings.fields.analytics_enabled]
name = "Analytics enabled"
type = "boolean"

[metaobjects.app.faq_settings.fields.default_status]
name = "Default status"
type = "single_line_text_field"
